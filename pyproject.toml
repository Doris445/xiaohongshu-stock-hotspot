[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiboard-a-share"
version = "0.1.0"
description = "Local-first A-share Xiaohongshu sentiment dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
crawl = [
  "agent-reach==1.5.0",
  "scrapling[fetchers]==0.4.12",
]
ocr = [
  "rapidocr-onnxruntime==1.4.4",
]
dev = [
  "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["config", "llm", "providers", "server", "service"]

[tool.ruff]
line-length = 100
target-version = "py310"
