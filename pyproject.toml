[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiboard-a-share"
version = "0.2.0"
description = "Local-first A-share Xiaohongshu sentiment dashboard"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
dependencies = [
  "numpy==2.2.6",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
xiaohongshu = [
  "agent-reach @ https://github.com/Panniantong/Agent-Reach/archive/refs/tags/v1.5.0.zip",
]
scrapling = [
  "scrapling[fetchers]==0.4.8",
]
crawl = [
  "agent-reach @ https://github.com/Panniantong/Agent-Reach/archive/refs/tags/v1.5.0.zip",
  "scrapling[fetchers]==0.4.8",
]
ocr = [
  "rapidocr-onnxruntime==1.4.4",
]
dev = [
  "ruff>=0.8",
]

[project.scripts]
sentiboard = "server:main"

[tool.setuptools]
py-modules = ["config", "eastmoney_browser_session", "eastmoney_guba", "history", "llm", "providers", "server", "service"]

[tool.ruff]
line-length = 100
target-version = "py310"
