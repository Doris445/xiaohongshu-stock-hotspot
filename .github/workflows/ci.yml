name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      STOCK_DASHBOARD_DISABLE_NETWORK: "1"
      SENTIBOARD_LLM_PROVIDER: local-keywords
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Validate PowerShell deployment scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 scripts/setup.ps1))
          [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 scripts/start.ps1))
      - name: Validate Bash deployment scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/start.sh
      - run: python scripts/doctor.py --json
      - run: python -m unittest -v test_dashboard.py
      - run: node --check static/app.js
      - run: python scripts/privacy_check.py
